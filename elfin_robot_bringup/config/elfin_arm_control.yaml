# Humble migration:
#   joint_state_controller -> joint_state_broadcaster
#   Removed `write_op_modes` (Foxy-only)
#
# The /**: block at the top supplies parameters to the EtherCAT hardware
# interface plugin loaded by ros2_control_node. The hardware plugin code reads
# elfin_ethernet_name / slave_no / joint_names / reduction_ratios /
# count_zeros / axis_position_factors / axis_torque_factors from there.

/**:
  ros__parameters:
    elfin_ethernet_name: enp0s31f6
    elfin_ethercat_drivers: ["elfin"]
    slave_no: [1, 2, 3]
    joint_names: [elfin_joint2, elfin_joint1, elfin_joint3, elfin_joint4, elfin_joint5, elfin_joint6]
    reduction_ratios: [101.0, 101.0, 101.0, 101.0, 101.0, 101.0]
    count_zeros: [10242122, 10249312, 21879416, 24588379, -2103880, 7914161]
    axis_position_factors: [131072.0, 131072.0, 131072.0, 131072.0, 131072.0, 131072.0]
    axis_torque_factors: [5251.283, 5251.283, 8533.125, 8533.125, 15975.05, 15975.05]

controller_manager:
  ros__parameters:
    update_rate: 50

    elfin_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

elfin_arm_controller:
  ros__parameters:
    joints:
      - elfin_joint1
      - elfin_joint2
      - elfin_joint3
      - elfin_joint4
      - elfin_joint5
      - elfin_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.6
      elfin_joint1: { trajectory: 0.2, goal: 0.1 }
      elfin_joint2: { trajectory: 0.2, goal: 0.1 }
      elfin_joint3: { trajectory: 0.2, goal: 0.1 }
      elfin_joint4: { trajectory: 0.2, goal: 0.1 }
      elfin_joint5: { trajectory: 0.2, goal: 0.1 }
      elfin_joint6: { trajectory: 0.2, goal: 0.1 }