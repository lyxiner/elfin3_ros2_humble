# Humble migration:
#   type was `position_controllers/JointTrajectoryController` which does
#   not exist; the correct type is `joint_trajectory_controller/...`.
#   This config is for the optional 2-DOF module/gripper; only loaded
#   when that module is actually attached.
elfin_module_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - elfin_module_joint1
      - elfin_module_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 10.0
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.1
    stop_trajectory_duration: 0.05